!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Navegador AR - Campus</title>
    <!-- Importamos A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        /* Interfaz de Usuario superpuesta a la cámara */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Deja pasar los toques a la escena 3D */
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; box-sizing: border-box; z-index: 10;
        }
        .panel {
            background: rgba(0, 0, 0, 0.7); color: white; padding: 15px 20px;
            border-radius: 12px; text-align: center; max-width: 90%;
            pointer-events: auto; 
            margin-bottom: 10px;
        }
        #instructions { font-size: 1.1rem; font-weight: bold; }
        #debug-info { font-size: 0.8rem; opacity: 0.8; margin-top: 5px; }
        .hidden { display: none !important; }
        
        /* Controles manuales de rotación (por si la brújula falla en interiores) */
        #manual-controls {
            display: flex; gap: 15px; pointer-events: auto;
            margin-bottom: 30px;
        }
        .rotate-btn {
            background: rgba(255, 255, 255, 0.9); color: #000; border: none; 
            padding: 12px 20px; font-size: 1rem; border-radius: 8px; 
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .rotate-btn:active { background: #ccc; }
        
        #btn-iniciar-ios {
            background: #2563eb; color: white; border: none; padding: 15px 30px;
            font-size: 1.2rem; border-radius: 30px; font-weight: bold; cursor: pointer;
            pointer-events: auto; position: absolute; top: 50%; transform: translateY(-50%);
        }
    </style>
</head>
<body>

    <!-- Capa de Interfaz UI -->
    <div id="ui-layer">
        <div class="panel" id="top-panel">
            <div id="instructions">Obteniendo destino...</div>
            <div id="debug-info"></div>
        </div>
        
        <button id="btn-iniciar-ios" class="hidden">Dar Permisos de Brújula y AR</button>

        <!-- Botones que aparecen después de anclar la ruta -->
        <div id="manual-controls" class="hidden">
            <button class="rotate-btn" id="btn-rotar-izq">↺ Girar Izq</button>
            <button class="rotate-btn" id="btn-rotar-der">Girar Der ↻</button>
        </div>
    </div>

    <!-- Escena A-Frame -->
    <a-scene 
        webxr="requiredFeatures: hit-test, local-floor;" 
        renderer="colorManagement: true;"
        navegador-rutas>
        
        <!-- Cámara -->
        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- Retícula: El cursor verde que aparece en el suelo -->
        <a-entity id="reticle" visible="false">
            <a-ring color="#00ff00" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0"></a-ring>
            <a-circle color="#00ff00" radius="0.02" rotation="-90 0 0"></a-circle>
        </a-entity>

        <!-- Contenedor maestro de la ruta. Moveremos y rotaremos este contenedor entero -->
        <a-entity id="ruta-container"></a-entity>

        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>
    </a-scene>

    <script>
        // --- SENSOR DE BRÚJULA GLOBAL ---
        let brujulaActual = 0;
        
        // Android
        window.addEventListener('deviceorientationabsolute', function(event) {
            if (event.alpha !== null) brujulaActual = 360 - event.alpha;
        });
        // iOS
        window.addEventListener('deviceorientation', function(event) {
            if (event.webkitCompassHeading) brujulaActual = event.webkitCompassHeading;
        });

        // --- 1. CONFIGURACIÓN DE RUTAS ---
        function generarCoordenadas(instrucciones) {
            let coordenadas = [];
            let posX = 0;
            let posY = 0; // Agregamos Altura (Y)
            let posZ = 0;
            let anguloActual = 0; 
            const ESPACIADO = 2.5; 

            instrucciones.forEach(paso => {
                // 1. GESTIÓN DE ÁNGULOS (Por defecto 90, pero personalizable)
                let gradosGiro = paso.grados !== undefined ? paso.grados : 90;

                if (paso.giro === 'izquierda') anguloActual -= gradosGiro;
                else if (paso.giro === 'derecha') anguloActual += gradosGiro;

                if (anguloActual >= 360) anguloActual -= 360;
                if (anguloActual < 0) anguloActual += 360;

                let rad = anguloActual * (Math.PI / 180);
                
                // 2. GESTIÓN DE ELEVACIÓN (Reparte la altura entre los puntos)
                let elevacionTotal = paso.elevacion || 0;
                let pasosEnTramo = Math.floor(paso.metros / ESPACIADO);
                let subidaPorPaso = pasosEnTramo > 0 ? (elevacionTotal / pasosEnTramo) : 0;
                
                for(let i=1; i<=pasosEnTramo; i++) {
                    posX += Math.sin(rad) * ESPACIADO;
                    posZ -= Math.cos(rad) * ESPACIADO; 
                    posY += subidaPorPaso; // Sube o baja gradualmente
                    coordenadas.push({x: posX, y: posY, z: posZ});
                }
                
                let resto = paso.metros % ESPACIADO;
                if(resto > 0.5) {
                    posX += Math.sin(rad) * resto;
                    posZ -= Math.cos(rad) * resto;
                    posY += elevacionTotal * (resto / paso.metros);
                    coordenadas.push({x: posX, y: posY, z: posZ});
                }
            });
            return coordenadas;
        }

        const rutasGuardadas = {
            "mi-destino": {
                // IMPORTANTE: Pon aquí los grados de la brújula (0 a 360) hacia donde apunta el primer tramo.
                // Ej: 0 es Norte, 90 es Este, 180 es Sur, 270 es Oeste.
                rumboInicial: 0, 
                pasos: generarCoordenadas([
                    // Ruta extraída del mapa (Total: 296.07m)
                    { giro: 'adelante', metros: 112, elevacion: 0 },
                    { giro: 'izquierda', grados: 45, metros: 18 },
                    { giro: 'izquierda', grados: 45, metros: 90 },
                    { giro: 'derecha', grados: 45, metros: 30 },
                    { giro: 'derecha', grados: 45, metros: 46.07 }
                ])
            }
        };

        // Variables globales
        let destinoActual = null;
        let rutaDibujada = false;
        let brujulaAlIniciar = 0;
        let rotacionManualAplicada = 0; // Para los botones de ajuste

        // --- 2. LÓGICA DE LA URL Y LA UI ---
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            destinoActual = urlParams.get('destino');
            const instructions = document.getElementById('instructions');
            const debugInfo = document.getElementById('debug-info');
            const scene = document.querySelector('a-scene');

            if (!destinoActual || !rutasGuardadas[destinoActual]) {
                instructions.innerText = "Error: Destino no encontrado.";
                return;
            }

            instructions.innerText = `Destino: ${destinoActual.toUpperCase()}`;
            debugInfo.innerText = "Inicia el modo AR y apunta al piso.";

            // Solicitar permisos en iOS si es necesario
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const btnIos = document.getElementById('btn-iniciar-ios');
                btnIos.classList.remove('hidden');
                btnIos.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        btnIos.classList.add('hidden');
                    }).catch(console.error);
                });
            }

            scene.addEventListener('enter-vr', function () {
                if (scene.is('ar-mode')) {
                    document.getElementById('top-panel').style.background = 'rgba(0,0,0,0.5)';
                    instructions.innerText = "Apunta al suelo para ubicar el inicio.";
                    // Guardamos hacia donde mira el usuario al abrir la cámara AR
                    brujulaAlIniciar = brujulaActual; 
                }
            });

            // Controles de rotación manual
            document.getElementById('btn-rotar-izq').addEventListener('click', () => ajustarRotacionManual(10));
            document.getElementById('btn-rotar-der').addEventListener('click', () => ajustarRotacionManual(-10));
        });

        function ajustarRotacionManual(grados) {
            rotacionManualAplicada += grados;
            const container = document.getElementById('ruta-container');
            const rotacionActual = container.getAttribute('rotation');
            container.setAttribute('rotation', `0 ${rotacionActual.y + grados} 0`);
        }

        // --- 3. COMPONENTE A-FRAME ---
        AFRAME.registerComponent('navegador-rutas', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;

                this.reticle = document.getElementById('reticle');
                this.rutaContainer = document.getElementById('ruta-container');
                this.instructions = document.getElementById('instructions');

                this.el.sceneEl.renderer.xr.addEventListener('sessionstart', (ev) => {
                    let session = this.el.sceneEl.renderer.xr.getSession();
                    
                    session.requestReferenceSpace('viewer').then((space) => {
                        this.viewerSpace = space;
                        session.requestHitTestSource({ space: this.viewerSpace })
                            .then((hitTestSource) => {
                                this.xrHitTestSource = hitTestSource;
                            });
                    });
                    session.requestReferenceSpace('local-floor').then((space) => {
                        this.refSpace = space;
                    });
                    session.addEventListener('select', () => this.onSelect());
                });
            },

            tick: function () {
                if (rutaDibujada || !this.el.sceneEl.is('ar-mode')) return;

                if (this.xrHitTestSource && this.refSpace) {
                    let frame = this.el.sceneEl.frame;
                    let hitTestResults = frame.getHitTestResults(this.xrHitTestSource);

                    if (hitTestResults.length > 0) {
                        let pose = hitTestResults[0].getPose(this.refSpace);
                        this.reticle.setAttribute('visible', 'true');
                        this.reticle.setAttribute('position', {
                            x: pose.transform.position.x,
                            y: pose.transform.position.y,
                            z: pose.transform.position.z
                        });
                        this.instructions.innerText = "¡Suelo detectado! Toca la pantalla.";
                    } else {
                        this.reticle.setAttribute('visible', 'false');
                    }
                }
            },

            onSelect: function () {
                if (this.reticle.getAttribute('visible') === false || rutaDibujada) return;

                const posicionCero = this.reticle.getAttribute('position');
                this.reticle.setAttribute('visible', 'false');
                rutaDibujada = true;
                
                this.instructions.innerText = "¡Sigue el camino!";
                document.getElementById('manual-controls').classList.remove('hidden');

                const rutaConfig = rutasGuardadas[destinoActual];
                const coordenadas = rutaConfig.pasos;
                const totalPuntos = coordenadas.length;

                // 1. MOVER EL CONTENEDOR AL ANCLAJE FÍSICO
                this.rutaContainer.setAttribute('position', posicionCero);

                // 2. APLICAR ROTACIÓN AUTOMÁTICA DE BRÚJULA
                // Calculamos cuánto rotar para que coincida con el rumbo real.
                let ajusteY = brujulaAlIniciar - rutaConfig.rumboInicial;
                this.rutaContainer.setAttribute('rotation', `0 ${ajusteY} 0`);
                
                // 3. DIBUJAR LOS PUNTOS (Ahora son relativos al contenedor)
                coordenadas.forEach((punto, index) => {
                    if (index === totalPuntos - 1) {
                        const metaTexto = document.createElement('a-entity');
                        metaTexto.setAttribute('position', `${punto.x} ${punto.y + 1.2} ${punto.z}`);
                        metaTexto.setAttribute('text', 'value: Llegaste a tu\ndestino; color: #10b981; align: center; width: 6; font: mozillavr; weight: bold;');
                        
                        const baseMeta = document.createElement('a-cylinder');
                        baseMeta.setAttribute('position', `${punto.x} ${punto.y + 0.05} ${punto.z}`);
                        baseMeta.setAttribute('radius', '0.6');
                        baseMeta.setAttribute('height', '0.05');
                        baseMeta.setAttribute('color', '#10b981'); 

                        this.rutaContainer.appendChild(metaTexto);
                        this.rutaContainer.appendChild(baseMeta);
                    } else {
                        const marcador = document.createElement('a-cone');
                        // Posición basada en la altura (y) calculada por los desniveles
                        marcador.setAttribute('position', `${punto.x} ${punto.y + 0.05} ${punto.z}`);
                        marcador.setAttribute('radius-bottom', '0.2');
                        marcador.setAttribute('radius-top', '0');
                        marcador.setAttribute('height', '0.1');
                        marcador.setAttribute('color', '#fbbf24'); 
                        marcador.setAttribute('rotation', '90 0 0'); 
                        
                        // Flota adaptándose a su altura base (punto.y)
                        marcador.setAttribute('animation', `property: position; dir: alternate; dur: 1000; loop: true; to: ${punto.x} ${punto.y + 0.15} ${punto.z}`);

                        this.rutaContainer.appendChild(marcador);
                    }
                });
            }
        });
    </script>
</body>
</html>
